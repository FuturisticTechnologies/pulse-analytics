name: Destroy environment

# Tears an environment down. Manual only, and deliberately awkward to run.
#
# Dev is meant to be destroyed - it costs ~GBP 30/month to leave standing, and
# `terraform apply` rebuilds it in about fifteen minutes. Making teardown a
# one-click, audited operation is what stops people leaving it up "just in
# case", which is how a demo environment turns into a line item nobody owns.
#
# The confirmation input is not decoration. `workflow_dispatch` sits next to
# every other workflow in the Actions list, and the difference between running
# this one and the deploy one is two characters. Typing the environment name is
# the smallest gate that makes the mistake impossible rather than unlikely.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      confirm:
        description: 'Type the environment name exactly to confirm (e.g. "dev")'
        required: true
        type: string
      reason:
        description: Why (recorded in the run summary)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Runs before the environment gate, so a typo is caught without waking an
  # approver, and prod is refused outright.
  # ---------------------------------------------------------------------------
  guard:
    name: Confirm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the confirmation matches
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::confirmation '${{ inputs.confirm }}' does not match environment '${{ inputs.environment }}'"
            exit 1
          fi

      - name: Refuse production
        if: inputs.environment == 'prod'
        run: |
          echo "::error::This workflow will not destroy production."
          echo "Destroying prod deletes the warehouse, the event history and every"
          echo "backup retention window along with it. If it is genuinely intended,"
          echo "it is a deliberate, supervised, out-of-hours operation run by a human"
          echo "at a terminal with the runbook open - not a button next to 'Deploy'."
          echo
          echo "  cd infrastructure/terraform"
          echo "  terraform init -backend-config=backend-prod.hcl"
          echo "  terraform destroy -var-file=environments/prod.tfvars"
          exit 1

      - name: Record the request
        run: |
          {
            echo "## Destroy requested"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Environment | **${{ inputs.environment }}** |"
            echo "| Requested by | @${{ github.actor }} |"
            echo "| Reason | ${{ inputs.reason }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  destroy:
    name: Destroy ${{ inputs.environment }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-setup
        with:
          environment: ${{ inputs.environment }}
          terraform-version: ${{ env.TF_VERSION }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show what will be destroyed
        working-directory: infrastructure/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          terraform plan -destroy \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -input=false -no-color -lock-timeout=5m \
            | tee destroy-plan.txt

          {
            echo "## Resources to be destroyed"
            echo
            echo '```terraform'
            grep -E '^\s+#|^Plan:' destroy-plan.txt | head -c 40000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The lake holds the only copy of anything not regenerable. Terraform will
      # delete the storage account without asking, so the last state of the data
      # is captured first - cheap insurance against a teardown that turns out to
      # have been a mistake.
      - name: Snapshot what the lake holds
        continue-on-error: true
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          account=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
          [ -z "$account" ] && { echo "No storage account in state."; exit 0; }

          echo "Inventory of $account before destruction:"
          for container in bronze silver gold exports; do
            count=$(az storage blob list \
              --account-name "$account" --container-name "$container" \
              --auth-mode login --query "length(@)" -o tsv 2>/dev/null || echo "?")
            echo "  $container: $count blobs"
          done | tee inventory.txt

      - name: Upload the inventory
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lake-inventory-${{ inputs.environment }}-${{ github.run_id }}
          path: infrastructure/terraform/inventory.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Destroy
        working-directory: infrastructure/terraform
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          terraform destroy \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -input=false -no-color -auto-approve -lock-timeout=5m

      - name: Confirm the estate is gone
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          remaining=$(terraform state list | wc -l)
          {
            echo "## Destroyed"
            echo
            echo "Resources left in state: **$remaining**"
            echo
            if [ "$remaining" -gt 0 ]; then
              echo "Some resources survived - usually a Key Vault in soft-delete, or a"
              echo "resource group Azure would not empty. Check the destroy log."
              terraform state list | sed 's/^/- /'
            else
              echo "Rebuild with: **Deploy infrastructure** -> environment"
              echo "\`${{ inputs.environment }}\`, apply ticked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
